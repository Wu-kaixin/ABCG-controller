# All distances are in metres; time is in seconds.
step: 1
scene:
  type: rectangle
  width: 28.0
  height: 16.0
  openings: []
crowd:
  count: 100
  spawn_vertices: [[8, 4], [20, 4], [20, 12], [8, 12]]
  spacing: 0.55
  radius: {mean: 0.20, std: 0.015, min: 0.17, max: 0.23}
  demand: {mean: 1.0, std: 0.12, min: 0.75, max: 1.25}
guides:
  count: 28
  radius: 0.20
  max_speed: 1.0
  initial_inset: 1.0
controller:
  method: average_cvt
  offset: 1.3
  sample_spacing: 0.1
  budget_gap: 2.0
  max_gap_limit: 2.0
  position_tolerance: 0.03
  speed_tolerance: 0.03
  curve_tolerance: 0.04
  arc_tolerance: 0.03
  safety_numeric_tolerance: 1.0e-7
  demand_bandwidth: 1.2
  gain: 1.5
  hold_steps: 10
  clearance: 0.35
  waypoint_tolerance: 0.05
  phases: [0.0, 0.25, 0.5, 0.75]
  quadrature_samples: 2048
  planner_max_iterations: 300
  stall_window: 20
  max_replans: 2
simulation:
  seed: 0
  dt: 0.1
  max_steps: 400
