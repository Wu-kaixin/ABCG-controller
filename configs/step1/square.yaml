# Metres and seconds. Room geometry and crowd spawn geometry are separate.
step: 1
scene:
  type: square
  width: 20.0
  height: 20.0
  openings: []
crowd:
  source: jupedsim
  static: true
  count: 80
  spawn_vertices: [[6, 6], [14, 6], [14, 14], [6, 14]]
  spacing: 0.55
  spawn_margin: 0.3
  heterogeneity:
    enabled: true
    radius: {mean: 0.20, std: 0.015, min: 0.17, max: 0.23}
    desired_speed: {mean: 1.25, std: 0.10, min: 0.95, max: 1.55}
    time_gap: {mean: 1.0, std: 0.08, min: 0.8, max: 1.2}
    demand_weight: {mean: 1.0, std: 0.12, min: 0.75, max: 1.25}
guides:
  count: 24
  radius: 0.20
  max_speed: 1.0
  sensing: global
  communication: unlimited
  initialization: {type: perimeter, inset: 1.0, phase: 0.012}
controller:
  boundary:
    estimator: alpha
    sample_spacing: 0.12
    min_observation_coverage: 0.8
    alpha_smoothing_passes: 2
    bootstrap_samples: 0
  deployment:
    offset: 1.3
    sample_spacing: 0.10
    weighted: true
    demand_bandwidth: 1.2
  resources: {g_req: 2.0, m_min: 3}
  planning: {max_iterations: 300, h_tolerance: 1.0e-8, target_tolerance: 1.0e-5}
  assignment: {lambda_switch: 0.0, reserve_cost: 0.0}
  motion: {k_p: 1.5, tracking_rmse_tolerance: 0.03, speed_tolerance: 0.03, hold_steps: 10}
  safety:
    crowd_clearance: 0.35
    guide_clearance: 0.20
    wall_clearance: 0.15
    residual_tolerance: 1.0e-9
    max_projection_sweeps: 200
simulation: {seed: 0, dt: 0.1, max_steps: 400}
