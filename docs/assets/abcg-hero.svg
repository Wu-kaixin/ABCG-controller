<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">ABCG Controller</title>
  <desc id="desc">Guide agents forming a safe deployment ring around a static crowd.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0c2030"/>
      <stop offset="1" stop-color="#123348"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d5c8"/>
      <stop offset="1" stop-color="#55a8ff"/>
    </linearGradient>
    <radialGradient id="crowd" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#ffca75"/>
      <stop offset="1" stop-color="#f08b55"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a6d5e8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="460" rx="28" fill="url(#bg)"/>
