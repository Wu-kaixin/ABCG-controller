[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abcg-controller"
version = "0.2.0"
description = "Simple static unknown-crowd guide deployment with JuPedSim"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2,<3", "PyYAML>=6,<7", "matplotlib>=3.8,<4", "jupedsim==1.4.2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
abcg = "run:main"

[tool.setuptools]
packages = ["controller"]
py-modules = ["run", "environment", "scene", "interfaces", "visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
